# 本地/预发一键编排（ERP 平台视为外部依赖，默认连 host.docker.internal:8000）
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${MES_SERVER_PORT:-8765}:8765"
    env_file:
      - .env
    environment:
      MES_RELOAD: "false"
      MES_SERVER_HOST: "0.0.0.0"
      # 容器内访问宿主机 ERP
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:-http://host.docker.internal:8000}
    volumes:
      - ./data:/app/data
      - ./apps/agent:/app/apps/agent:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${VITE_PORT:-5180}:5180"
    environment:
      VITE_API_PROXY: http://api:8765
    depends_on:
      api:
        condition: service_healthy
