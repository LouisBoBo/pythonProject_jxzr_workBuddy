# 高可用编排：多 API 实例 + 共享 data 卷 + nginx 入口
# 用法：
#   docker compose -f docker-compose.ha.yml up -d --build --scale api=2
# 入口：http://127.0.0.1:8765 （nginx）→ 后端多副本
#
# 依赖：宿主机或外部 ERP（PLATFORM_BASE_URL）

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      MES_RELOAD: "false"
      MES_SERVER_HOST: "0.0.0.0"
      MES_SERVER_PORT: "8765"
      # 容器内统一数据目录（与卷挂载一致）
      DATA_DIR: /app/data
      # 实例标识：默认识别 HOSTNAME；可覆盖
      INSTANCE_ID: ${INSTANCE_ID:-}
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:-http://host.docker.internal:8000}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    volumes:
      - ./data:/app/data
      - ./apps/agent:/app/apps/agent:ro
    expose:
      - "8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  lb:
    image: nginx:1.27-alpine
    ports:
      - "${MES_SERVER_PORT:-8765}:80"
    volumes:
      - ./deploy/nginx-ha.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${VITE_PORT:-5180}:5180"
    environment:
      # 浏览器侧仍走宿主机入口（lb）
      VITE_API_PROXY: http://lb:80
    depends_on:
      - lb
